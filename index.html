  :root { --ground: #000000; --ink: #ffffff; --soft: rgba(255,255,255,.62); --ring: rgba(255,255,255,.6); --focus: #ffd27a; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden;
         font-family: Nunito, "Arial Rounded MT Bold", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
  #music { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px);
           width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1.5px solid var(--ring);
           background: rgba(0,0,0,.35); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  #music svg { width: 22px; height: 22px; }
  #music .slash { transition: opacity .3s; }
  #music.on .slash { opacity: 0; }
  #music.on svg { animation: spin 5s linear infinite; }
  #music:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hint { position: fixed; z-index: 2; left: 70px; right: 70px; top: calc(env(safe-area-inset-top, 0px) + 26px);
          text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .05em; color: var(--soft);
          pointer-events: none; transition: opacity 1.2s; text-wrap: balance; }
  #hint.gone { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #music.on svg { animation: none; } }

<body>

<canvas id="scene" aria-label="Trái tim Trung Thu gửi Nguyễn Thị Hoài Anh"></canvas>
<button id="music" type="button" aria-label="Bật nhạc" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
    <path class="slash" d="M3 3l18 18"/>
  </svg>
</button>
<div id="hint">Chạm vào màn hình để bật nhạc</div>

<script>
(() => {
  // ====== NỘI DUNG ======
  const NAME = 'Nguyễn Thị Hoài Anh';
  const MESSAGES = ['Chúc em Trung Thu vui vẻ và ấm áp', NAME, 'Mãi bên cạnh anh nhé', 'Anh yêu em bé nhiều'];
  const SEPS = ['💛', '🥮', '💗', '🏮', '💚', '💖'];
  const PHRASE = 'Yêu Hoài Anh nhất trên đời';   // chữ bay lên

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPEED = reduce ? 0.45 : 1;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const FONT = s => `800 ${s}px Nunito, "Arial Rounded MT Bold", Arial, sans-serif`;
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0, DPR = 1, S = 0;
  let hcx, hcy, hk, Dh, dcx, dcy, R, Dd;
  const PITCH = 0.62, SP = Math.sin(PITCH), CP = Math.cos(PITCH);
  let fontReady = false;

  // ====== BẢNG GLYPH (vẽ sẵn từng ký tự để xoay/chiếu nhanh) ======
  const REF = 64;
  const glyphs = new Map();
  function glyph(ch) {
    let g = glyphs.get(ch);
    if (g) return g;
    const c = document.createElement('canvas');
    const x = c.getContext('2d');
    x.font = FONT(REF);
    const w = x.measureText(ch).width;
    const blank = ch.trim() === '';
    c.width = blank ? 1 : Math.ceil(w) + 16;
    c.height = blank ? 1 : Math.ceil(REF * 1.5);
    if (!blank) {
      x.font = FONT(REF); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
      x.fillText(ch, c.width / 2, c.height / 2 + REF * 0.04);
    }
    g = { c, w, blank, hw: c.width / 2, hh: c.height / 2 };
    glyphs.set(ch, g);
    return g;
  }
  const textW = s => Array.from(s).reduce((a, ch) => a + glyph(ch).w, 0);

  // ====== TRÁI TIM HẠT ======
  let N = 0, tipX, tipY, tx, ty, tz, fx, fy, fz, ln, sx0, sy0, sz0, dl, ph0, groups, sparks;
  const NG = 8;
  function heartXY(t) {
    const s = Math.sin(t);
    return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5];
  }
  function buildHeart() {
    N = (W * H > 700000) ? 6200 : 4600;
    tx = new Float32Array(N); ty = new Float32Array(N); tz = new Float32Array(N);
    fx = new Float32Array(N); fy = new Float32Array(N); fz = new Float32Array(N);
    ln = new Float32Array(N); sx0 = new Float32Array(N); sy0 = new Float32Array(N); sz0 = new Float32Array(N);
    dl = new Float32Array(N); ph0 = new Float32Array(N); tipX = new Float32Array(N); tipY = new Float32Array(N);
    groups = Array.from({ length: NG }, () => []); sparks = [];
    for (let i = 0; i < N; i++) {
      const t = Math.random() * Math.PI * 2;
      const [hx, hy] = heartXY(t);
      const edge = Math.random() < 0.5;
      const s = edge ? rnd(0.86, 1.06) : Math.pow(Math.random(), 0.4) * 0.9;
      const x = hx * s, y = hy * s;
      const th = Math.sqrt(Math.max(0, 1 - Math.min(1, s) ** 2));
      const z = (Math.random() * 2 - 1) * 5.5 * (edge ? 0.35 : th + 0.15);
      tx[i] = x; ty[i] = y; tz[i] = z;
      let a = Math.atan2(y, x) + rnd(-0.45, 0.45);
      const cz = rnd(-0.35, 0.35);
      fx[i] = Math.cos(a); fy[i] = Math.sin(a); fz[i] = cz;
      ln[i] = edge ? rnd(5, 16) : rnd(3, 12);
      const u = Math.random(), v = Math.random() * Math.PI * 2, rr = rnd(28, 60);
      sx0[i] = Math.cos(v) * rr * Math.sqrt(1 - u * u) * 1.2;
      sy0[i] = Math.sin(v) * rr * Math.sqrt(1 - u * u) * 1.6;
      sz0[i] = (u * 2 - 1) * rr;
      dl[i] = Math.random() * 0.9;
      ph0[i] = Math.random() * 6.283;
      const bright = edge ? rnd(0.45, 1) : rnd(0.25, 0.8);
      const lvl = Math.min(3, Math.floor(bright * 4));
      groups[lvl * 2 + (Math.random() < 0.5 ? 0 : 1)].push(i);
      if (edge && Math.random() < 0.09) sparks.push(i);
    }
  }
  const ALPHA = [0.16, 0.32, 0.55, 0.85];

  function drawHeart(T) {
    const hue = 350;   // một màu cố định: đỏ hồng
    const yaw = 0.42 * Math.sin(T * 0.45 * SPEED);
    const cyw = Math.cos(yaw), syw = Math.sin(yaw);
    const ph = (T % 1.1) / 1.1;
    const beat = 1 + 0.045 * Math.exp(-(((ph - 0.08) / 0.05) ** 2)) + 0.028 * Math.exp(-(((ph - 0.26) / 0.06) ** 2));
    const k = hk * beat, ox = hcx, oy = hcy + Math.sin(T * 0.9) * S * 0.012;
    const flen = S / 400;

    // quầng sáng sau tim
    ctx.globalCompositeOperation = 'source-over';
    const gl = ctx.createRadialGradient(ox, oy, 0, ox, oy, S * 0.6);
    gl.addColorStop(0, `hsla(${hue},90%,50%,0.13)`); gl.addColorStop(1, `hsla(${hue},90%,50%,0)`);
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.15; ctx.lineCap = 'round';
    const P = (x, y, z, out) => { // x,y,z px
      const rx = x * cyw + z * syw, rz = -x * syw + z * cyw;
      const s = Dh / (Dh + rz);
      out[0] = ox + rx * s; out[1] = oy + y * s;
    };
    const a = [0, 0], b = [0, 0];
    for (let gi = 0; gi < NG; gi++) {
      const idx = groups[gi];
      const lvl = gi >> 1, off = (gi & 1) ? 8 : -12;
      ctx.strokeStyle = `hsla(${hue + off},95%,${lvl >= 2 ? 64 : 56}%,${ALPHA[lvl]})`;
      ctx.beginPath();
      for (let j = 0; j < idx.length; j++) {
        const i = idx[j];
        let x = tx[i], y = ty[i], z = tz[i];
        let p = (T - dl[i]) / 1.9;
        if (p < 1) {
          p = p < 0 ? 0 : p;
          const e = 1 - (1 - p) ** 3;
          x = sx0[i] + (x - sx0[i]) * e; y = sy0[i] + (y - sy0[i]) * e; z = sz0[i] + (z - sz0[i]) * e;
        }
        const X = x * k, Y = y * k, Z = z * k;
        const L = ln[i] * flen * (0.7 + 0.3 * Math.sin(T * 3 + ph0[i]));
        P(X, Y, Z, a);
        P(X + fx[i] * L, Y + fy[i] * L, Z + fz[i] * L, b);
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
        tipX[i] = b[0]; tipY[i] = b[1];
      }
      ctx.stroke();
    }
    ctx.fillStyle = `hsla(${hue},100%,82%,0.9)`;
    ctx.beginPath();
    for (const i of sparks) {
      const tw = 0.6 + 0.4 * Math.sin(T * 5 + ph0[i]);
      const r = 1.4 * tw;
      ctx.rect(tipX[i] - r / 2, tipY[i] - r / 2, r, r);
    }
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ====== ĐĨA CHỮ XOAY ======
  let rings = [], dust = [], floaters = [];
  function buildRings() {
    rings = [];
    if (!fontReady) return;
    const n = 7;
    for (let i = 0; i < n; i++) {
      const r = R * (0.22 + 0.78 * i / (n - 1));
      let fs = S * 0.052 * (0.55 + 0.45 * r / R);
      const circ = 2 * Math.PI * r;
      const unit = () => fs / REF;
      const seq = []; let width = 0; let k = i;
      for (let guard = 0; guard < 12; guard++) {
        const piece = MESSAGES[k % MESSAGES.length] + '  ' + SEPS[k % SEPS.length] + '  ';
        const w = textW(piece) * unit();
        if (seq.length && width + w > circ) break;
        if (!seq.length && w > circ * 1.35) { k++; continue; }
        seq.push(piece); width += w; k++;
      }
      if (!seq.length) { const p = NAME + '  💛  '; seq.push(p); width = textW(p) * unit(); }
      let m = circ / width, stretch = 1;
      if (m > 1.25) { stretch = m / 1.25; m = 1.25; }
      if (m < 0.72) m = 0.72;
      fs *= m;
      const items = []; let acc = 0;
      for (const ch of Array.from(seq.join(''))) {
        const g = glyph(ch);
        const adv = g.w * fs / REF * stretch;
        if (!g.blank) items.push({ g, a: (acc + adv / 2) / r });
        acc += adv;
      }
      rings.push({ r, fs, items, speed: -(0.10 + 0.10 * (1 - i / (n - 1))) * SPEED, bright: 0.75 + 0.25 * i / (n - 1) });
    }
    floaters = Array.from({ length: 16 }, (_, i) => ({
      g: glyph(SEPS[i % SEPS.length]), r: R * rnd(0.25, 1.02), a: rnd(0, 6.283), ph: rnd(0, 6.283), s: rnd(0.8, 1.2)
    }));
  }
  function buildDust() {
    dust = Array.from({ length: 750 }, () => {
      const r = R * Math.pow(Math.random(), 0.7) * 1.12 + R * 0.04;
      return { r, a: rnd(0, 6.283), sz: rnd(0.6, 1.8), ph: rnd(0, 6.283), warm: Math.random() < 0.35 };
    });
  }
  const proj = (x, z, out) => { const q = Dd + z * CP, sc = Dd / q; out[0] = dcx + x * sc; out[1] = dcy - z * SP * sc; out[2] = sc; out[3] = q; };

  function drawDisk(T) {
    const o = [0, 0, 0, 0];
    // bụi sao
    ctx.globalCompositeOperation = 'lighter';
    for (const warm of [false, true]) {
      ctx.fillStyle = warm ? 'rgba(255,214,140,0.75)' : 'rgba(235,240,255,0.7)';
      ctx.beginPath();
      for (const d of dust) {
        if (d.warm !== warm) continue;
        const w = -(0.10 + 0.10 * (1 - d.r / R)) * SPEED;
        const th = d.a + T * w;
        proj(d.r * Math.cos(th), d.r * Math.sin(th), o);
        const s = d.sz * o[2] * (0.55 + 0.45 * Math.sin(T * 2 + d.ph));
        ctx.rect(o[0], o[1], s, s);
      }
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // chữ trên vòng tròn (nằm trên mặt đĩa, có phối cảnh)
    for (const ring of rings) {
      const rot = T * ring.speed, r = ring.r, sc0 = ring.fs / REF;
      for (const it of ring.items) {
        const th = it.a + rot, c = Math.cos(th), s = Math.sin(th);
        const x = r * c, z = r * s;
        proj(x, z, o);
        const sc = o[2], q = o[3];
        if (sc * ring.fs < 2.2) continue;
        if (o[0] < -60 || o[0] > W + 60 || o[1] > H + 40) continue;
        const jxz = -x * sc * CP / q, jyz = -SP * sc * sc;
        const tX = -s, tZ = c, nX = c, nZ = s;
        const a1 = sc * tX + jxz * tZ, b1 = jyz * tZ;
        const c1 = sc * nX + jxz * nZ, d1 = jyz * nZ;
        ctx.globalAlpha = Math.min(1, (0.72 - 0.3 * (z / r)) * ring.bright);
        ctx.setTransform(DPR * a1 * sc0, DPR * b1 * sc0, DPR * c1 * sc0, DPR * d1 * sc0, DPR * o[0], DPR * o[1]);
        ctx.drawImage(it.g.c, -it.g.hw, -it.g.hh);
      }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // emoji lơ lửng trên đĩa
    for (const f of floaters) {
      const th = f.a - T * 0.12 * SPEED;
      proj(f.r * Math.cos(th), f.r * Math.sin(th), o);
      const size = S * 0.045 * f.s * o[2];
      const lift = (8 + 6 * Math.sin(T * 1.6 + f.ph)) * o[2];
      const sc = size / REF;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(f.g.c, o[0] - f.g.hw * sc, o[1] - lift - f.g.hh * sc, f.g.c.width * sc, f.g.c.height * sc);
    }
    ctx.globalAlpha = 1;
  }

  // ====== TIM ĐỎ & CHỮ BAY LÊN, HIỆU ỨNG CHẠM ======
  const HEART_PX = 96;
  const redHeart = (() => {
    const s = HEART_PX, pad = 30, c = document.createElement('canvas');
    c.width = c.height = s + pad * 2;
    const x = c.getContext('2d');
    x.translate(pad, pad);
    const path = new Path2D();
    path.moveTo(s * 0.5, s * 0.9);
    path.bezierCurveTo(s * 0.12, s * 0.62, s * 0.0, s * 0.42, s * 0.06, s * 0.26);
    path.bezierCurveTo(s * 0.13, s * 0.08, s * 0.40, s * 0.04, s * 0.5, s * 0.24);
    path.bezierCurveTo(s * 0.60, s * 0.04, s * 0.87, s * 0.08, s * 0.94, s * 0.26);
    path.bezierCurveTo(s * 1.0, s * 0.42, s * 0.88, s * 0.62, s * 0.5, s * 0.9);
    path.closePath();
    const g = x.createRadialGradient(s * 0.36, s * 0.3, s * 0.05, s * 0.5, s * 0.5, s * 0.62);
    g.addColorStop(0, '#ff6b78'); g.addColorStop(0.55, '#f0142f'); g.addColorStop(1, '#b3001b');
    x.shadowColor = 'rgba(255,30,60,0.85)'; x.shadowBlur = 24;
    x.fillStyle = g; x.fill(path);
    x.shadowBlur = 0;
    x.fillStyle = 'rgba(255,255,255,0.45)';
    x.beginPath(); x.ellipse(s * 0.28, s * 0.3, s * 0.09, s * 0.05, -0.7, 0, 6.283); x.fill();
    return { c, hw: c.width / 2, hh: c.height / 2 };
  })();
  function drawRedHeart(x, y, size, rot, alpha) {
    const sc = size / HEART_PX, c = Math.cos(rot) * sc * DPR, s = Math.sin(rot) * sc * DPR;
    ctx.globalAlpha = alpha;
    ctx.setTransform(c, s, -s, c, DPR * x, DPR * y);
    ctx.drawImage(redHeart.c, -redHeart.hw, -redHeart.hh);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  const risers = []; let lastHeart = 0, lastPhrase = -0.5;
  const bursts = [];
  function spawnPoint() {
    const o = [0, 0, 0, 0], r = R * rnd(0.15, 0.85), th = rnd(0, 6.283);
    proj(r * Math.cos(th), r * Math.sin(th), o);
    return o;
  }
  function updateRisers(T, dt) {
    if (T > 1.2 && T - lastHeart > 0.2) {       // tim đỏ bay lên
      lastHeart = T; const o = spawnPoint();
      risers.push({ kind: 'heart', x: o[0], y: o[1], vy: -rnd(26, 46) * (S / 400), vx: rnd(-8, 8), t: 0,
                    life: rnd(3.4, 5), size: S * rnd(0.03, 0.06) * o[2], ph: rnd(0, 6.283) });
    }
    if (fontReady && T - lastPhrase > 1.6) {   // chữ "Yêu Hoài Anh nhất trên đời" bay lên
      lastPhrase = T; const o = spawnPoint();
      const fs = S * rnd(0.045, 0.055) * o[2];
      ctx.font = FONT(fs.toFixed(1));
      const half = ctx.measureText(PHRASE).width / 2 + 24;
      const x = Math.min(W - half, Math.max(half, o[0]));
      risers.push({ kind: 'text', x, y: o[1], vy: -rnd(32, 44) * (S / 400), vx: rnd(-1.5, 1.5), t: 0,
                    life: rnd(4.2, 5.4), fs, ph: rnd(0, 6.283) });
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = risers.length - 1; i >= 0; i--) {
      const p = risers[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) { risers.splice(i, 1); continue; }
      const a = Math.sin(Math.PI * p.t / p.life);
      const sway = Math.sin(T * 1.8 + p.ph);
      if (p.kind === 'heart') {
        drawRedHeart(p.x + sway * 6, p.y, p.size * (0.88 + 0.12 * Math.sin(T * 6 + p.ph)), sway * 0.25, a * 0.95);
      } else {
        ctx.globalAlpha = a;
        ctx.font = FONT(p.fs.toFixed(1));
        ctx.shadowColor = 'rgba(255,35,65,0.95)'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#fff';
        ctx.fillText(PHRASE, p.x + sway * 3, p.y);
        ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      }
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      p.t += dt; p.vy -= 30 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.life) { bursts.splice(i, 1); continue; }
      const k = p.t / p.life;
      drawRedHeart(p.x, p.y, p.size * (0.6 + 0.6 * k), p.rot, 1 - k * k);
    }
    ctx.globalAlpha = 1;
  }
  function burst(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = rnd(0, 6.283), v = rnd(50, 150);
      bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: rnd(1.1, 1.7),
                    size: rnd(14, 26), rot: rnd(-0.4, 0.4) });
    }
  }

  // ====== NỀN SAO ======
  let stars = [];
  function buildStars() {
    stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: rnd(0.5, 1.5), ph: rnd(0, 6.283) }));
  }
  function drawBackground(T) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const intro = Math.max(0, 1 - T / 3.6);
    if (intro > 0) {
      const a = intro ** 1.4;
      const g = ctx.createRadialGradient(W / 2, H * 0.34, 0, W / 2, H * 0.34, Math.max(W, H) * 0.85);
      g.addColorStop(0, `rgba(255,90,140,${0.9 * a})`);
      g.addColorStop(0.45, `rgba(200,20,70,${0.8 * a})`);
      g.addColorStop(1, `rgba(80,5,25,${0.7 * a})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(T * 1.3 + s.ph));
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  // ====== BỐ CỤC ======
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H * 0.6);
    hcx = W / 2; hcy = H * 0.37; hk = S * 0.44 / 16; Dh = S * 3;
    dcx = W / 2; dcy = H * 0.775; R = S * 0.6; Dd = S * 3;
    buildStars(); buildDust(); buildRings();
    if (!N) buildHeart();
  }
  window.addEventListener('resize', resize);
  resize();

  // chờ font tải xong rồi mới dựng chữ vòng
  const fontWait = (async () => {
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    if (document.fonts && document.fonts.load) await document.fonts.load(FONT(REF), 'Nguyễn Thị Hoài Anh ấm áp');
  })();
  Promise.race([fontWait, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => {
    glyphs.clear(); fontReady = true; buildRings();
  });

  // ====== VÒNG LẶP VẼ ======
  const t0 = performance.now(); let last = t0;
  function frame(now) {
    const T = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground(T);
    drawDisk(T);
    drawHeart(T);
    updateRisers(T, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ====== NHẠC HỘP (giai điệu tự soạn, không lời) ======
  const btn = document.getElementById('music'), hint = document.getElementById('hint');
  let actx = null, master = null, playing = false, loopStart = 0, evIdx = 0, timer = 0;
  const BEAT = 60 / 80, LOOP = 32;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const EVENTS = (() => {
    const ev = [];
    const halves = [[48,0],[48,0],[45,1],[45,1],[41,0],[41,0],[43,0],[43,0],[48,0],[48,0],[45,1],[45,1],[41,0],[43,0],[48,0],[48,0]];
    halves.forEach(([root, minor], h) => {
      const third = minor ? 3 : 4, base = root + 12;
      [0, 7, 12, 12 + third].forEach((iv, j) => ev.push({ b: h * 2 + j * 0.5, m: base + iv, d: 1.3, v: 0.045 }));
    });
    [[0,76,2],[2,79,1],[3,76,1],[4,72,3],[7,69,1],[8,72,1],[9,74,1],[10,76,1],[11,77,1],[12,74,4],
     [16,76,2],[18,79,1],[19,81,1],[20,79,2],[22,76,2],[24,77,1],[25,76,1],[26,74,2],[28,72,4]]
      .forEach(([b, m, d]) => ev.push({ b, m, d: Math.max(1.4, d * BEAT * 1.2), v: 0.11 }));
    return ev.sort((a, b) => a.b - b.b);
  })();
  function note(m, t, dur, vol) {
    const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), g2 = actx.createGain();
    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.value = midi(m); o2.frequency.value = midi(m) * 3.01;
    g2.gain.value = 0.12;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function schedule() {
    const ahead = actx.currentTime + 0.3;
    for (let guard = 0; guard < 64; guard++) {
      const e = EVENTS[evIdx], t = loopStart + e.b * BEAT;
      if (t > ahead) break;
      if (t >= actx.currentTime - 0.02) note(e.m, t, e.d, e.v);
      evIdx++;
      if (evIdx >= EVENTS.length) { evIdx = 0; loopStart += LOOP * BEAT; }
    }
  }
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0.9;
    const delay = actx.createDelay(1), fb = actx.createGain(), lp = actx.createBiquadFilter(), wet = actx.createGain();
    delay.delayTime.value = 0.28; fb.gain.value = 0.32; lp.type = 'lowpass'; lp.frequency.value = 2600; wet.gain.value = 0.28;
    master.connect(actx.destination);
    master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(actx.destination);
    loopStart = actx.currentTime + 0.1; evIdx = 0;
    timer = setInterval(schedule, 60);
    return true;
  }
  function setPlaying(on) {
    if (on && !actx && !initAudio()) return;
    if (!actx) return;
    playing = on;
    if (on) actx.resume(); else actx.suspend();
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Tắt nhạc' : 'Bật nhạc');
    hint.classList.add('gone');
  }
  btn.addEventListener('click', e => { e.stopPropagation(); setPlaying(!playing); });
  cv.addEventListener('pointerdown', e => {
    burst(e.clientX, e.clientY);
    if (!actx) setPlaying(true);
  });
})();
</script>

</body>
